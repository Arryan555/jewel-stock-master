          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PurchaseVoucher" }
    delete:
      operationId: deletePurchase
      tags: [purchases]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                required: [id]
  /purchases/{id}/payment:
    post:
      operationId: recordPurchasePayment
      tags: [purchases]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PurchasePaymentInput" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PurchaseVoucherSummary" }

  /amc:
    get:
      operationId: getAmcSettings
      tags: [amc]
      summary: Get AMC settings
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AmcSettings" }
    put:
      operationId: updateAmcSettings
      tags: [amc]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AmcSettingsInput" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AmcSettings" }

